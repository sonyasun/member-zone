<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一造管理记忆口诀考前必看 - 建筑云课</title>
  <link rel="stylesheet" href="css/styles.css?v=8" />
</head>
<body>
  <div class="page page--course-learn">
    <header class="course-learn-header">
      <div class="course-learn-header__left">
        <a class="course-learn-back" href="course.html?free=1">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3.5 5.5 8 10 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          课程详情
        </a>
        <span class="course-learn-header__sep" aria-hidden="true"></span>
        <h1 class="course-learn-header__title" data-course-learn-title>一造管理记忆口诀考前必看</h1>
      </div>
      <div class="course-learn-header__actions">
        <button type="button" class="course-learn-header__action">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 2v8M5.5 7.5 8 10l2.5-2.5M3 12.5h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          资料下载
        </button>
        <button type="button" class="course-learn-header__action">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="12" cy="3.5" r="1.75" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="4" cy="8" r="1.75" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="12" cy="12.5" r="1.75" stroke="currentColor" stroke-width="1.2"/>
            <path d="M5.55 7.15 10.45 4.35M5.55 8.85 10.45 11.65" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          分享
        </button>
        <img class="course-learn-header__avatar" src="assets/login-avatar.png" width="32" height="32" alt="用户头像" />
      </div>
    </header>

    <main class="course-learn-main">
      <section class="course-learn-player" aria-label="视频播放">
        <div class="course-learn-stage" data-course-learn-stage>
          <div class="course-learn-slide" aria-hidden="true">
            <span class="course-learn-slide__brand">Glodon 广联达 · 建筑云课</span>
            <div class="course-learn-slide__content">
              <p class="course-learn-slide__camp">一级造价工程师-口诀巧学营</p>
              <p class="course-learn-slide__subject">《建设工程造价管理》</p>
              <p class="course-learn-slide__teacher">丹 姗</p>
            </div>
          </div>
          <button type="button" class="course-learn-play" data-course-learn-play aria-label="播放">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
              <path d="M10 7.5v13l11-6.5-11-6.5Z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <div class="course-learn-controls">
          <div class="course-learn-controls__progress">
            <div class="course-learn-controls__track">
              <div class="course-learn-controls__fill" data-course-learn-progress style="width:0.6%"></div>
            </div>
          </div>
          <div class="course-learn-controls__bar">
            <div class="course-learn-controls__time">
              <time data-course-learn-current>00:04</time>
              <span>/</span>
              <time data-course-learn-duration>11:38</time>
            </div>
            <div class="course-learn-controls__tools">
              <button type="button" class="course-learn-controls__btn" data-course-learn-volume aria-label="音量">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                  <path d="M3 7.5v3h2.5L9 14.5V3.5L5.5 7.5H3Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
                  <path d="M12 6.5a4 4 0 0 1 0 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                </svg>
              </button>
              <button type="button" class="course-learn-controls__btn course-learn-controls__btn--rate" data-course-learn-rate>1x</button>
              <button type="button" class="course-learn-controls__btn" data-course-learn-fullscreen aria-label="全屏">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                  <path d="M3 7V3h4M11 3h4v4M14 11v4h-4M7 14H3v-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="course-learn-chapter-rate" data-course-learn-chapter-rate aria-expanded="true">
          <div class="course-learn-chapter-rate__label">
            <span class="course-learn-chapter-rate__badge" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M7 1.75 8.54 5.14l3.71.3-2.82 2.43.86 3.63L7 9.67 3.71 11.5l.86-3.63-2.82-2.43 3.71-.3L7 1.75Z" fill="currentColor"/>
              </svg>
            </span>
            章节评价
          </div>
          <div class="course-learn-chapter-rate__expand">
            <span class="course-learn-chapter-rate__sep" aria-hidden="true"></span>
            <div class="course-learn-chapter-rate__stars" role="radiogroup" aria-label="章节评分">
              <button type="button" class="course-learn-chapter-rate__star" data-chapter-star="1" aria-label="1 星"></button>
              <button type="button" class="course-learn-chapter-rate__star" data-chapter-star="2" aria-label="2 星"></button>
              <button type="button" class="course-learn-chapter-rate__star" data-chapter-star="3" aria-label="3 星"></button>
              <button type="button" class="course-learn-chapter-rate__star" data-chapter-star="4" aria-label="4 星"></button>
              <button type="button" class="course-learn-chapter-rate__star" data-chapter-star="5" aria-label="5 星"></button>
            </div>
            <span class="course-learn-chapter-rate__hint" data-chapter-rate-hint>请打分</span>
          </div>
          <button type="button" class="course-learn-chapter-rate__close" data-chapter-rate-close aria-label="关闭章节评价">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M3 3l6 6M9 3 3 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </section>

      <aside class="course-learn-sidebar" aria-label="课程目录">
        <h2 class="course-learn-sidebar__heading">课程目录</h2>
        <div class="course-learn-catalog" data-course-learn-catalog>
          <details class="course-learn-chapter" open>
            <summary class="course-learn-chapter__summary">管理</summary>
            <ul class="course-learn-lessons">
              <li>
                <button type="button" class="course-learn-lesson is-active" data-lesson-id="1" data-lesson-title="一造管理记忆口诀考前必看" data-lesson-duration="698" data-lesson-progress="1">
                  <span class="course-learn-lesson__icon" aria-hidden="true"></span>
                  <span class="course-learn-lesson__body">
                    <span class="course-learn-lesson__title">管理科目学习指引</span>
                    <span class="course-learn-lesson__meta">已学 1%</span>
                  </span>
                </button>
              </li>
              <li>
                <button type="button" class="course-learn-lesson" data-lesson-id="2" data-lesson-title="高频考点技巧口诀" data-lesson-duration="845" data-lesson-progress="0">
                  <span class="course-learn-lesson__icon" aria-hidden="true"></span>
                  <span class="course-learn-lesson__body">
                    <span class="course-learn-lesson__title">高频考点技巧口诀</span>
                    <span class="course-learn-lesson__meta">已学 0%</span>
                  </span>
                </button>
              </li>
              <li>
                <button type="button" class="course-learn-lesson" data-lesson-id="3" data-lesson-title="计算公式技巧口诀" data-lesson-duration="920" data-lesson-progress="0">
                  <span class="course-learn-lesson__icon" aria-hidden="true"></span>
                  <span class="course-learn-lesson__body">
                    <span class="course-learn-lesson__title">计算公式技巧口诀</span>
                    <span class="course-learn-lesson__meta">已学 0%</span>
                  </span>
                </button>
              </li>
            </ul>
          </details>
        </div>
      </aside>
    </main>
    <div class="course-learn-toast" id="course-learn-toast" hidden role="status" aria-live="polite"></div>

    <button type="button" class="course-learn-dev-trigger" data-bad-review-open>弹窗按钮</button>

    <div class="course-learn-bad-review" id="course-learn-bad-review" hidden>
      <div class="course-learn-bad-review__mask" data-bad-review-close></div>
      <div
        class="course-learn-bad-review__dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="course-learn-bad-review-title"
      >
        <button type="button" class="course-learn-bad-review__close" data-bad-review-close aria-label="关闭">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="course-learn-bad-review__hero" aria-hidden="true">
          <img
            class="course-learn-bad-review__emoji-img"
            data-bad-review-emoji
            src="assets/review-emoji-low.png"
            width="80"
            height="80"
            alt=""
          />
        </div>
        <p class="course-learn-bad-review__title" id="course-learn-bad-review-title" data-bad-review-title>差评，课程太差了</p>
        <div class="course-learn-bad-review__stars" role="radiogroup" aria-label="课程评分">
          <button type="button" class="course-learn-bad-review__star is-active" data-bad-review-star="1" aria-label="1 星"></button>
          <button type="button" class="course-learn-bad-review__star" data-bad-review-star="2" aria-label="2 星"></button>
          <button type="button" class="course-learn-bad-review__star" data-bad-review-star="3" aria-label="3 星"></button>
          <button type="button" class="course-learn-bad-review__star" data-bad-review-star="4" aria-label="4 星"></button>
          <button type="button" class="course-learn-bad-review__star" data-bad-review-star="5" aria-label="5 星"></button>
        </div>
        <div class="course-learn-bad-review__tags" data-bad-review-tags></div>
        <div class="course-learn-bad-review__field">
          <textarea
            class="course-learn-bad-review__textarea"
            rows="4"
            maxlength="200"
            placeholder="这门课程差吗？看看你如何吐槽~"
            data-bad-review-text
          ></textarea>
          <span class="course-learn-bad-review__count"><b data-bad-review-count>0</b> / 200</span>
        </div>
        <button type="button" class="course-learn-bad-review__submit" data-bad-review-submit>提交</button>
      </div>
    </div>
  </div>
  <script src="js/course-learn.js?v=6" defer></script>
</body>
</html>
